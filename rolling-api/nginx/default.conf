# 1. API 및 기본 도메인 설정 (Spring Boot)
server {
    listen 80;
    server_name rolling-app.com api.rolling-app.com;
    return 301 https://$host$request_uri; # HTTP를 HTTPS로 강제 전환
}

server {
    listen 443 ssl;
    server_name rolling-app.com api.rolling-app.com;

    # SSL 인증서 경로 (Certbot이 만든 경로와 일치해야 함)
    ssl_certificate /etc/letsencrypt/live/rolling-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rolling-app.com/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. 관리자 대시보드 설정 (React)
server {
    listen 80;
    server_name admin.rolling-app.com;
    return 301 https://$host$request_uri; # HTTP를 HTTPS로 강제 전환
}

server {
    listen 443 ssl;
    server_name admin.rolling-app.com;

    ssl_certificate /etc/letsencrypt/live/rolling-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rolling-app.com/privkey.pem;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}