name: Deploy to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub에 올린 소스 코드를 가져옵니다.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files for debugging
        run: ls -R

      # 2. Docker Hub에 로그인합니다 (아까 등록한 Secrets 사용)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Spring Boot 이미지를 빌드하고 Docker Hub에 올립니다.
      - name: Build and Push Spring Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile  # Spring용 Dockerfile 경로
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rolling-backend:latest

      # 4. (추가) Nginx 이미지를 빌드하고 Docker Hub에 올립니다.
      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/nginx.Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rolling-nginx:latest

      # 5. 마지막으로 서버에 접속해서 명령을 내립니다 (기존 코드)
      - name: 서버에 접속해서 배포 스크립트 실행하기
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # 이 부분은 다음 단계에서 수정할 겁니다!
            chmod +x /home/ubuntu/deploy.sh
            /home/ubuntu/deploy.sh
