spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Rolling API

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: existing schema baseline
    validate-on-migrate: true
    clean-disabled: true

  jackson:
    default-property-inclusion: non_null

logging:
  level:
    root: INFO
    com.rolling.api: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} level=%-5level requestId=%X{requestId:-} traceId=%X{traceId:-} userId=%X{userId:-} method=%X{method:-} path=%X{path:-} status=%X{status:-} errorCode=%X{errorCode:-} domainId=%X{domainId:-} logger=%logger{36} - %msg%n%wEx"

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      roles: ADMIN
  metrics:
    tags:
      application: ${spring.application.name}

# port 번호
server:
  port: 8080
  forward-headers-strategy: framework

# JWT 관련
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000

auth:
  withdraw:
    schedule:
      cron: "0 * * * * *"
      zone: "Asia/Seoul"

admin:
  user-ids: ${ADMIN_USER_IDS:}


openmat:
  status:
    schedule:
      enabled: true
      cron: "0 * * * * *"
      zone: "Asia/Seoul"
  testing:
    allow-unauthenticated-update: ${OPENMAT_ALLOW_UNAUTHENTICATED_UPDATE:false}

firebase:
  enabled: true
  project-id: ${FIREBASE_PROJECT_ID:}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

push-notification:
  android-channel-id: ${PUSH_NOTIFICATION_ANDROID_CHANNEL_ID:rolling_open_mat_alerts}

# 대회 크롤링 스케줄링 주기
tournament:
  crawler:
    admin-key: ${TOURNAMENT_CRAWLER_ADMIN_KEY:}
    schedule:
      enabled: true
      cron: "0 0 2 * * *"
      zone: "Asia/Seoul"
    street-jiujitsu:
      list-page-urls:
        - "https://www.street-jiujitsu.com/"

# S3 관련
cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET_NAME}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false
