spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Rolling API

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

logging:
  level:
    root: INFO
    com.rolling.api: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: OFF

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000


tournament:
  crawler:
    manual:
      endpoint-public: true
    schedule:
      enabled: true
      cron: "0 0 2 * * *"
      zone: "Asia/Seoul"
    street-jiujitsu:
      list-page-urls:
        - "https://www.street-jiujitsu.com/"
