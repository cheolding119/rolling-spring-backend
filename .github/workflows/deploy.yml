name: Deploy to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 소스 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Spring Boot 빌드 (경로 수정됨)
      - name: Build and Push Spring Image
        uses: docker/build-push-action@v5
        with:
          context: ./rolling-api      
          file: ./rolling-api/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rolling-backend:latest

      # 4. Nginx 빌드 (경로 수정됨)
      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./rolling-api/nginx
          file: ./rolling-api/nginx/nginx.Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rolling-nginx:latest

      # 5. Lightsail 서버에 접속해서 배포 실행
      - name: 서버에 접속해서 배포 스크립트 실행하기
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            chmod +x /home/ubuntu/deploy.sh
            /home/ubuntu/deploy.sh
