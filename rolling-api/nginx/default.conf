# [중요] 1. 관리자 대시보드 (React) - 이 블록을 맨 위로 배치합니다.
server {
    listen 80;
    server_name admin.rolling-app.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.rolling-app.com;

    # SSL 인증서 (반드시 admin.rolling-app.com이 포함되어 있어야 함)
    ssl_certificate /etc/letsencrypt/live/rolling-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rolling-app.com/privkey.pem;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

# [중요] 2. API 및 기본 도메인 (Spring Boot) - 그 다음으로 배치합니다.
server {
    listen 80;
    server_name rolling-app.com api.rolling-app.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rolling-app.com api.rolling-app.com;

    ssl_certificate /etc/letsencrypt/live/rolling-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rolling-app.com/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}