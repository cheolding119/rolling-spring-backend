server {
    listen 80;
    listen [::]:80;
    server_name rolling-app.com www.rolling-app.com admin.rolling-app.com api.rolling-app.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1. 랜딩 페이지 (React)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rolling-app.com;

    ssl_certificate /etc/letsencrypt/live/rolling-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rolling-app.com/privkey.pem;

    location / {
        root   /usr/share/nginx/landing;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

# 2. www -> 루트 도메인 리다이렉트
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rolling-app.com;

    ssl_certificate /etc/letsencrypt/live/rolling-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rolling-app.com/privkey.pem;

    location / {
        return 301 https://rolling-app.com$request_uri;
    }
}

# 3. 관리자 대시보드 (React)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.rolling-app.com;

    ssl_certificate /etc/letsencrypt/live/rolling-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rolling-app.com/privkey.pem;

    location / {
        root   /usr/share/nginx/admin;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

# 4. API 서버 (Spring Boot)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rolling-app.com;

    ssl_certificate /etc/letsencrypt/live/rolling-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rolling-app.com/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
