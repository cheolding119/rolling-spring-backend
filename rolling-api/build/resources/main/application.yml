spring:
  application:
    name: Rolling API

  datasource:
    # allowPublicKeyRetrieval=true 옵션을 추가해야 MySQL 8.0 접속 오류가 없습니다.
    url: jdbc:mysql://localhost:3306/rolling?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

logging:
  level:
    root: INFO
    com.rolling.api: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: 8080

jwt:
  # Base64 encoded 256-bit secret key (개발용, 운영 환경에서는 환경 변수로 설정)
  secret: ${JWT_SECRET:cm9sbGluZy1hcGktand0LXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LWVudmlyb25tZW50LW9ubHk=}
  access-token-expiry: 1800000      # 30분 (밀리초)
  refresh-token-expiry: 1209600000  # 14일 (밀리초)