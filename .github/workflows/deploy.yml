name: Deploy Spring & Nginx to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 💡 SHA 태그를 함께 사용하여 롤백이 가능하도록 빌드
      - name: Build and Push Spring Image
        uses: docker/build-push-action@v5
        with:
          context: ./rolling-api
          file: ./rolling-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rolling-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/rolling-backend:${{ github.sha }}

      # 💡 Nginx 빌드 경로 및 태그 교정
      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./rolling-api/nginx
          file: ./rolling-api/nginx/nginx.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rolling-nginx:latest
            ${{ secrets.DOCKER_USERNAME }}/rolling-nginx:${{ github.sha }}

      - name: 서버에 접속해서 실무형 배포 명령 실행
        uses: appleboy/ssh-action@v1.0.3 # 💡 버전을 명확히 고정
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # 1. 프로젝트 폴더로 이동
            cd /home/ubuntu/rolling-spring-backend
            
            # 2. GitHub 설정 파일(docker-compose.yml 등) 강제 동기화
            git fetch origin main
            git reset --hard origin/main
            
            cd rolling-api
            
            # 3. 💡 핵심: 현재 배포 버전을 알리는 .env 파일 자동 생성
            # 기존 .env 내용을 유지하고 싶다면 필요한 변수들만 덮어쓰도록 구성하세요.
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
            echo "IMAGE_TAG=${{ github.sha }}" >> .env
            echo "SERVER_NAME=${{ secrets.SERVER_NAME }}" >> .env
            
            # 4. 이미지 내려받기 (Docker Hub에서 가져오므로 pull이 이제 작동함)
            docker compose pull
            
            # 5. 재시작 (설정 변경분 반영 및 정리)
            docker compose up -d --remove-orphans
            
            # 6. 구버전 이미지 청소
            docker image prune -f
