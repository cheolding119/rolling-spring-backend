name: Deploy Spring, Nginx, and Monitoring to Lightsail

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Spring Image
        uses: docker/build-push-action@v5
        with:
          context: ./rolling-api
          file: ./rolling-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rolling-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/rolling-backend:${{ github.sha }}

      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./rolling-api/nginx
          file: ./rolling-api/nginx/nginx.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rolling-nginx:latest
            ${{ secrets.DOCKER_USERNAME }}/rolling-nginx:${{ github.sha }}

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd /home/ubuntu/rolling-spring-backend
            git fetch origin main
            git reset --hard origin/main

            cd rolling-api

            cat <<EOF > .env
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            IMAGE_TAG=${{ github.sha }}
            SERVER_NAME=${{ secrets.SERVER_NAME }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
            AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}
            AWS_S3_PUBLIC_BASE_URL=${{ secrets.AWS_S3_PUBLIC_BASE_URL }}
            ADMIN_USER_IDS=${{ secrets.ADMIN_USER_IDS }}
            TOURNAMENT_CRAWLER_ADMIN_KEY=${{ secrets.TOURNAMENT_CRAWLER_ADMIN_KEY }}
            FIREBASE_ENABLED=${{ secrets.FIREBASE_ENABLED }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_CREDENTIALS_PATH=${{ secrets.FIREBASE_CREDENTIALS_PATH }}
            OPENMAT_ALLOW_UNAUTHENTICATED_UPDATE=${{ secrets.OPENMAT_ALLOW_UNAUTHENTICATED_UPDATE }}
            SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }}

            GRAFANA_ADMIN_USER=admin
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            GRAFANA_ROOT_URL=${{ secrets.GRAFANA_ROOT_URL }}

            SLACK_ALERT_ENABLED=true
            SLACK_ALERT_WEBHOOK_URL=${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
            SLACK_ALERT_ENVIRONMENT=prod

            SLACK_METRICS_ALERT_WEBHOOK_URL=${{ secrets.SLACK_METRICS_ALERT_WEBHOOK_URL }}
            SLACK_METRICS_ALERT_ENVIRONMENT=prod

            
            EOF

            docker compose -f docker-compose.yml -f docker-compose.monitoring.yml pull
            docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d --remove-orphans
            docker image prune -f
