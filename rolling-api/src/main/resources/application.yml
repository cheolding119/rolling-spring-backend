spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Rolling API

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: existing schema baseline
    validate-on-migrate: true
    clean-disabled: true

  jackson:
    default-property-inclusion: non_null

logging:
  level:
    root: INFO
    com.rolling.api: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} level=%-5level requestId=%X{requestId:-} traceId=%X{traceId:-} userId=%X{userId:-} method=%X{method:-} path=%X{path:-} status=%X{status:-} errorCode=%X{errorCode:-} domainId=%X{domainId:-} logger=%logger{36} - %msg%n%wEx"

management:
  server:
    port: 9090
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      roles: ADMIN
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

slack:
  alert:
    enabled: ${SLACK_ALERT_ENABLED:false}
    webhook-url: ${SLACK_ALERT_WEBHOOK_URL:}
    environment: ${SLACK_ALERT_ENVIRONMENT:${spring.application.name}}
    connect-timeout-ms: ${SLACK_ALERT_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${SLACK_ALERT_READ_TIMEOUT_MS:3000}
    default-cooldown-seconds: ${SLACK_ALERT_DEFAULT_COOLDOWN_SECONDS:300}
    scheduler-cooldown-seconds: ${SLACK_ALERT_SCHEDULER_COOLDOWN_SECONDS:600}
    notify-unexpected-exception: ${SLACK_ALERT_NOTIFY_UNEXPECTED_EXCEPTION:true}
    notify-external-api-exception: ${SLACK_ALERT_NOTIFY_EXTERNAL_API_EXCEPTION:true}
    notify-scheduler-failure: ${SLACK_ALERT_NOTIFY_SCHEDULER_FAILURE:true}
    notify-startup-health-down: ${SLACK_ALERT_NOTIFY_STARTUP_HEALTH_DOWN:true}

# port 번호
server:
  port: 8080
  forward-headers-strategy: framework

# JWT 관련
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000

auth:
  withdraw:
    schedule:
      cron: "0 * * * * *"
      zone: "Asia/Seoul"

admin:
  user-ids: ${ADMIN_USER_IDS:}

apple:
  auth:
    client-id: ${APPLE_CLIENT_ID:}
    issuer: ${APPLE_ISSUER:https://appleid.apple.com}
    jwks-url: ${APPLE_JWKS_URL:https://appleid.apple.com/auth/keys}

kakao:
  map:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    local-api-base-url: ${KAKAO_LOCAL_API_BASE_URL:https://dapi.kakao.com}
    connect-timeout-ms: ${KAKAO_LOCAL_API_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${KAKAO_LOCAL_API_READ_TIMEOUT_MS:3000}

openmat:
  status:
    schedule:
      enabled: true
      cron: "0 * * * * *"
      zone: "Asia/Seoul"
  testing:
    allow-unauthenticated-update: ${OPENMAT_ALLOW_UNAUTHENTICATED_UPDATE:false}

firebase:
  enabled: true
  project-id: ${FIREBASE_PROJECT_ID:}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

push-notification:
  android-channel-id: ${PUSH_NOTIFICATION_ANDROID_CHANNEL_ID:rolling_open_mat_alerts}

# 대회 크롤링 스케줄링 주기
tournament:
  crawler:
    admin-key: ${TOURNAMENT_CRAWLER_ADMIN_KEY:}
    schedule:
      enabled: true
      cron: "0 0 2 * * *"
      zone: "Asia/Seoul"
    street-jiujitsu:
      list-page-urls:
        - "https://www.street-jiujitsu.com/"

# S3 관련
cloud:
  aws:
    s3:
      # 운영(prod)에서는 반드시 CloudFront 또는 공개 이미지 도메인을 넣어야 한다.
      bucket: ${AWS_S3_BUCKET_NAME}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false
